# MCUboot with ECDSA P-256 image signatures and overwrite-only upgrades.
# The image version (VERSION file / CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION) must
# equal QDSD_FW_MAJOR.MINOR.PATCH in include/qdsd/qdsd_config.h: the token
# refuses images older than itself before MCUboot even sees them.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
# Development key only. Production images are signed by the DTII release HSM;
# MCUboot is built with the matching public key.
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="\${APP_DIR}/keys/fw_signing_DEV_ONLY.pem"
SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y
