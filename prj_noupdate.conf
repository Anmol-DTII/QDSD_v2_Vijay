# ─────────────────────────────────────────────────────────────────────────────
# Bring-up overlay: build WITHOUT MCUboot and without firmware update.
#   west build -b qdsd/nrf52840 . -- -DBOARD_ROOT=... \
#     -DEXTRA_CONF_FILE="prj_lab.conf;prj_noupdate.conf"
# (no --sysbuild). UPDATE_BEGIN/WRITE/FINISH answer 6D00. NOT FOR PRODUCTION:
# a token built this way can only be reflashed through SWD.
# ─────────────────────────────────────────────────────────────────────────────
CONFIG_QDSD_FW_UPDATE=n
