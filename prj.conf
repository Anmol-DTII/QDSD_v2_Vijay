# ─────────────────────────────────────────────────────────────────────────────
# QDSD firmware 0.6 — PRODUCT configuration (NCS v3.0.0 / Zephyr)
# Bench builds: -DEXTRA_CONF_FILE=prj_lab.conf
# ─────────────────────────────────────────────────────────────────────────────

# ── No Bluetooth (Ascert.en flows: phone talks only to DTI Cloud) ────────────────
CONFIG_BT=n

# ── USB CCID smart-card reader (TS3USB221 gate opens after self-test) ──────
# Class 0x0B: the OS's own CCID driver binds; no vendor descriptors needed.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_BOS=n
CONFIG_USB_DEVICE_OS_DESC=n
CONFIG_USB_MAX_NUM_TRANSFERS=8
CONFIG_USB_WORKQUEUE=y
CONFIG_USB_WORKQUEUE_STACK_SIZE=2048
CONFIG_USB_DEVICE_VID=0x1915
CONFIG_USB_DEVICE_PID=0x520F
CONFIG_USB_DEVICE_MANUFACTURER="DTIIL"
CONFIG_USB_DEVICE_PRODUCT="TrustBox"
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USB_CDC_ACM=n

# ── Board I/O ──────────────────────────────────────────────────────────────
CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_I2C=y

# ── NXP Plug & Trust nano (SE050 on I2C1, SE052F on I2C0) ───────────────────
CONFIG_PLUGANDTRUST=y
CONFIG_PLUGANDTRUST_SCP03=y
CONFIG_PLUGANDTRUST_ECKEY=n
CONFIG_PLUGANDTRUST_ECKEY_SCP03=n
CONFIG_PLUGANDTRUST_SM_APDU_MUTEX=y
CONFIG_PLUGANDTRUST_LOG_LEVEL_DBG=n
# RSA-2048 responses (256-byte signature/modulus + TLV + SCP03) exceed 255.
CONFIG_PLUGANDTRUST_APDU_BUFFER_SIZE=512

# ── MCU crypto (SHA-256, self-test, .pfx key unwrap, import key check) ────
# Stored phone / cloud keys are checked inside the SE050 (QDSD_VERIFY_IN_SE).
# 0.6.4: PSA Crypto API (src/port/port_crypto.c). The legacy options
# (NORDIC_SECURITY_BACKEND, MBEDTLS_ECP_C, MBEDTLS_RSA_C, MBEDTLS_GCM_C ...)
# are deprecated since NCS 2.8 and are no longer used.
CONFIG_NRF_SECURITY=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
# CC310 on the nRF52840 does AES-128 only; Oberon (software) covers
# AES-256-GCM and anything else CC310 lacks.
CONFIG_PSA_CRYPTO_DRIVER_OBERON=y
CONFIG_PSA_CRYPTO_DRIVER_CC3XX=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_SIGN=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_PUBLIC_KEY=y
CONFIG_PSA_WANT_RSA_KEY_SIZE_2048=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_AES_KEY_SIZE_256=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=16384
CONFIG_ENTROPY_GENERATOR=y

# ── Internal flash NVS: read once to move 0.3-0.5 records into the SEs ─────
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y

# ── Update over the token interface (CONFIG_QDSD_FW_UPDATE, default y,
#    selects the DFU image manager; needs --sysbuild for MCUboot) ──────────
CONFIG_REBOOT=y

# ── Kernel ─────────────────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=8192

# ── Hardening ──────────────────────────────────────────────────────────────
# Lock SWD so SCP03 keys and RAM cannot be read out (Flow 1: lock debug ports).
CONFIG_NRF_APPROTECT_LOCK=y
CONFIG_LOG=n
CONFIG_ASSERT=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
