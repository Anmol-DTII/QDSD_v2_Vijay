# ─────────────────────────────────────────────────────────────────────────────
# QDSD firmware 0.6 — PRODUCT configuration (NCS v3.0.0 / Zephyr)
# Bench builds: -DEXTRA_CONF_FILE=prj_lab.conf
# ─────────────────────────────────────────────────────────────────────────────

# ── No Bluetooth (Ascert.en flows: phone talks only to DTI Cloud) ────────────────
CONFIG_BT=n

# ── USB CCID smart-card reader (TS3USB221 gate opens after self-test) ──────
# Class 0x0B: the OS's own CCID driver binds; no vendor descriptors needed.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_BOS=n
CONFIG_USB_DEVICE_OS_DESC=n
CONFIG_USB_MAX_NUM_TRANSFERS=8
CONFIG_USB_WORKQUEUE=y
CONFIG_USB_WORKQUEUE_STACK_SIZE=2048
CONFIG_USB_DEVICE_VID=0x1915
CONFIG_USB_DEVICE_PID=0x520F
CONFIG_USB_DEVICE_MANUFACTURER="DTIIL"
CONFIG_USB_DEVICE_PRODUCT="TrustBox"
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USB_CDC_ACM=n

# ── Board I/O ──────────────────────────────────────────────────────────────
CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_I2C=y

# ── NXP Plug & Trust nano (SE050 on I2C1, SE052F on I2C0) ───────────────────
CONFIG_PLUGANDTRUST=y
CONFIG_PLUGANDTRUST_SCP03=y
CONFIG_PLUGANDTRUST_ECKEY=n
CONFIG_PLUGANDTRUST_ECKEY_SCP03=n
CONFIG_PLUGANDTRUST_SM_APDU_MUTEX=y
CONFIG_PLUGANDTRUST_LOG_LEVEL_DBG=n
# RSA-2048 responses (256-byte signature/modulus + TLV + SCP03) exceed 255.
CONFIG_PLUGANDTRUST_APDU_BUFFER_SIZE=512

# ── MCU crypto (SHA-256, self-test, .pfx key unwrap, import key check) ────
# Stored phone / cloud keys are checked inside the SE050 (QDSD_VERIFY_IN_SE).
CONFIG_NORDIC_SECURITY_BACKEND=y
CONFIG_MBEDTLS_ECDSA_C=y
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y
CONFIG_MBEDTLS_SHA256_C=y
CONFIG_MBEDTLS_RSA_C=y
CONFIG_MBEDTLS_PKCS1_V15=y
CONFIG_MBEDTLS_GCM_C=y
CONFIG_MBEDTLS_HEAP_SIZE=16384
CONFIG_ENTROPY_GENERATOR=y

# ── Internal flash NVS: read once to move 0.3-0.5 records into the SEs ─────
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y

# ── Update over the token interface: stage image in MCUboot slot 1 ─────────
CONFIG_REBOOT=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_IMG_ENABLE_IMAGE_CHECK=y

# ── Kernel ─────────────────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=8192

# ── Hardening ──────────────────────────────────────────────────────────────
# Lock SWD so SCP03 keys and RAM cannot be read out (Flow 1: lock debug ports).
CONFIG_NRF_APPROTECT_LOCK=y
CONFIG_LOG=n
CONFIG_ASSERT=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
