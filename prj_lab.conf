# ─────────────────────────────────────────────────────────────────────────────
# QDSD firmware 0.6 — LAB overlay. NOT FOR PRODUCTION.
#   west build -b qdsd/nrf52840 . -- -DBOARD_ROOT=... -DEXTRA_CONF_FILE=prj_lab.conf
# ─────────────────────────────────────────────────────────────────────────────

# NXP default SCP03 keys (public). SE050 C2 unless CONFIG_QDSD_SE050_C1=y.
CONFIG_QDSD_SCP03_LAB_KEYS=y

# Debug access and logs over RTT.
CONFIG_NRF_APPROTECT_LOCK=n
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_ASSERT=y

# Shorter nonce lifetime makes expiry easy to test on the bench.
CONFIG_QDSD_NONCE_TTL_S=120
# Short login idle timeout for bench testing of Flow 2b.
CONFIG_QDSD_SESSION_IDLE_S=300
# To enable the QDSD as a EXternal Flash Device
CONFIG_QDSD_INSTALL_DRIVE=y
